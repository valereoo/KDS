[project]
name = "kds"
version = "1.0.0"
description = "Meiosis phase classifier from microscopy images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.32.0",
    "opencv-python-headless>=4.9.0.80",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn==1.6.1",
    "joblib>=1.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
